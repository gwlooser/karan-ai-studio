<!doctype html><title>KARAN AI STUDIO v1</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{background:#10121c;color:#fff;font:16px system-ui;max-width:900px;margin:auto;padding:20px}textarea,input{width:100%;margin:8px 0;padding:10px;background:#191d2b;color:#fff;border:1px solid #f6a72d;border-radius:8px}button{background:#f6a72d;padding:10px;border:0;border-radius:8px;font-weight:bold}.chapter{border-left:3px solid #f6a72d;padding:10px;margin:8px 0;background:#191d2b}</style><h1>KARAN AI STUDIO v1</h1><p>Education video planner · drafts stay in this browser.</p><label>Project title<input id="t" value="My education video"></label><label>Minutes (1–60)<input id="m" type="number" min="1" max="60" value="12"></label><label>Learning goal<textarea id="g"></textarea></label><label>Script<textarea id="s" rows="12" placeholder="Chapter 1: Introduction"></textarea></label><button onclick="go()">Review & build storyboard</button> <button onclick="save()">Save project</button><pre id="r"></pre><div id="b"></div><script>function go(){let s=document.querySelector("#s").value,w=s.trim()?s.trim().split(/\s+/).length:0,n=Math.ceil(w/130),c=s.split(/\n(?=Chapter\s*\d+[:.\s])/i).filter(Boolean);document.querySelector("#r").textContent=w+" words · estimated "+n+" min"+(n>+document.querySelector("#m").value?" · add time or shorten script":"");document.querySelector("#b").innerHTML=c.map((x,i)=>"<article class=chapter><b>"+x.split("\n")[0]+"</b><p>Scene "+(i+1)+": establishing visual → diagram → example → recap.</p></article>").join("")||"Add Chapter headings."}function save(){let a=JSON.parse(localStorage.karan||"[]");a.push({title:t.value,script:s.value,date:new Date().toLocaleString()});localStorage.karan=JSON.stringify(a);alert("Saved in this browser")}</script>
